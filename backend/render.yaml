services:
  - type: web
    name: codeshield-ai-backend
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_2
        sync: false
      - key: GEMINI_MODEL_3
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        sync: false
      - key: LLAMA_API_KEY
        sync: false
      - key: LLAMA_BASE_URL
        sync: false
      - key: LLAMA_MODEL
        sync: false
      - key: LLM_PROVIDER_ORDER
        value: gemini,gemini2,gemini3,grok,llama
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SEMGREP_PATH
        value: semgrep
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
      - key: MAX_CONCURRENT_ANALYSES
        value: "3"
      - key: AI_REQUEST_TIMEOUT_MS
        value: "90000"
      - key: AI_MAX_RETRIES
        value: "1"
      - key: AGENT_MAX_ANALYSIS_TIME_MS
        value: "240000"
      - key: AGENT_MAX_ITERATIONS
        value: "10"
      - key: AGENT_MAX_TOOL_CALLS
        value: "20"
